title: AI News Daily
description: 毎日の生成AIニュースを Claude Code が自動収集・要約してまとめる日本語アーカイブ
theme: jekyll-theme-minimal
lang: ja-JP

# 親ディレクトリの summaries/ も Jekyll の対象にする
include:
  - ../summaries

# サマリーは frontmatter 付きMarkdownなので Jekyll でそのままレンダリング可能
defaults:
  - scope:
      path: "../summaries"
    values:
      layout: default

# GitHub Pages で利用するプラグイン
plugins:
  - jekyll-feed
  - jekyll-seo-tag
