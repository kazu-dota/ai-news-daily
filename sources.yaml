# AI News Daily — 監視対象ソース定義
#
# category:
#   vendor          - 企業/モデル発表 (公式ブログ・リリース)
#   vendor_ms       - Microsoft Copilot エコシステム (重点扱い)
#   community       - 技術コミュニティ (HN, Reddit, GitHub Trending)
#   papers_trending - 話題の研究論文 (Hugging Face Papers など)
#   media           - 海外メディア
#   media_jp        - 日本語メディア
#
# priority: high / medium / low
#   ルーティンは high を必ずチェック、medium は時間が許せばチェック、low は余裕があれば。
#
# filter (任意):
#   ai_keywords          - AI関連キーワード (LLM, AI, model, 生成AI, etc.) でフィルタリング
#   ms_copilot_keywords  - Microsoft Copilot 関連キーワードでフィルタリング
#                          (Copilot, Copilot Studio, M365 Copilot, GitHub Copilot,
#                           Power Platform, Azure AI Foundry, Microsoft 365 Copilot Wave 等)

sources:
  # ============== Vendor (企業/モデル発表) ==============
  - name: Anthropic News
    url: https://www.anthropic.com/news
    category: vendor
    priority: high
  - name: OpenAI Blog
    url: https://openai.com/blog
    category: vendor
    priority: high
  - name: Google DeepMind Blog
    url: https://deepmind.google/discover/blog/
    category: vendor
    priority: high
  - name: Meta AI Blog
    url: https://ai.meta.com/blog/
    category: vendor
    priority: medium
  - name: Mistral AI News
    url: https://mistral.ai/news/
    category: vendor
    priority: medium
  - name: xAI News
    url: https://x.ai/news
    category: vendor
    priority: medium
  - name: Hugging Face Blog
    url: https://huggingface.co/blog
    category: vendor
    priority: medium

  # ============== Microsoft Copilot エコシステム (重点扱い) ==============
  # 利用組織が Microsoft 製品中心のため、Copilot 系は必ず全件チェックし、
  # 出力 md でも独立セクションとして扱う。
  - name: Microsoft Source (公式ニュース)
    url: https://news.microsoft.com/source/
    category: vendor_ms
    priority: high
    filter: ms_copilot_keywords
  - name: Microsoft 365 Blog
    url: https://www.microsoft.com/en-us/microsoft-365/blog/
    category: vendor_ms
    priority: high
    filter: ms_copilot_keywords
  - name: Microsoft Copilot Blog (Microsoft 365 Copilot)
    url: https://www.microsoft.com/en-us/microsoft-copilot/blog/
    category: vendor_ms
    priority: high
  - name: Microsoft Power Platform Blog (Copilot Studio 含む)
    url: https://www.microsoft.com/en-us/power-platform/blog/
    category: vendor_ms
    priority: high
    filter: ms_copilot_keywords
  - name: Microsoft AI Blog
    url: https://blogs.microsoft.com/ai/
    category: vendor_ms
    priority: high
  - name: Azure AI Blog
    url: https://azure.microsoft.com/en-us/blog/category/ai/
    category: vendor_ms
    priority: medium
    filter: ms_copilot_keywords
  - name: Microsoft Tech Community — Copilot
    url: https://techcommunity.microsoft.com/category/microsoft365copilot
    category: vendor_ms
    priority: medium
  - name: Microsoft Research Blog
    url: https://www.microsoft.com/en-us/research/blog/
    category: vendor_ms
    priority: medium
  - name: GitHub Blog — Copilot
    url: https://github.blog/category/ai-and-ml/
    category: vendor_ms
    priority: medium
  - name: 日本マイクロソフト 公式 Blog
    url: https://www.microsoft.com/ja-jp/biz/news/
    category: vendor_ms
    priority: medium
    filter: ms_copilot_keywords

  # ============== Community ==============
  - name: Hacker News (front page)
    url: https://news.ycombinator.com/
    category: community
    priority: medium
    filter: ai_keywords
  - name: Reddit r/MachineLearning (top/day)
    url: https://www.reddit.com/r/MachineLearning/top/.json?t=day
    category: community
    priority: medium
  - name: Reddit r/LocalLLaMA (top/day)
    url: https://www.reddit.com/r/LocalLLaMA/top/.json?t=day
    category: community
    priority: medium
  - name: GitHub Trending (Python/today)
    url: https://github.com/trending/python?since=daily
    category: community
    priority: low
    filter: ai_keywords
  - name: GitHub Trending (TypeScript/today)
    url: https://github.com/trending/typescript?since=daily
    category: community
    priority: low
    filter: ai_keywords

  # ============== Papers (Trending) ==============
  - name: Hugging Face Papers (daily)
    url: https://huggingface.co/papers
    category: papers_trending
    priority: medium
    note: 話題スコア順なので「ネットで話題の論文」検出に最適

  # ============== Media (English) ==============
  - name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/
    category: media
    priority: medium
  - name: The Verge AI
    url: https://www.theverge.com/ai-artificial-intelligence
    category: media
    priority: medium
  - name: VentureBeat AI
    url: https://venturebeat.com/category/ai/
    category: media
    priority: low

  # ============== Media (日本語) ==============
  - name: ITmedia AI+
    url: https://www.itmedia.co.jp/aiplus/
    category: media_jp
    priority: medium
  - name: Ledge.ai
    url: https://ledge.ai/
    category: media_jp
    priority: low
  - name: AI Scholar
    url: https://ai-scholar.tech/
    category: media_jp
    priority: low

# ペイウォール注意リスト (本文要約せず、タイトル+リンクのみ)
paywalled_or_protected:
  - nikkei.com         # 日経電子版
  - wsj.com            # WSJ
  - ft.com             # FT
  - nytimes.com        # NYT
  - bloomberg.com      # Bloomberg
  - nhk.or.jp          # NHK
  - businessinsider.com

# Microsoft Copilot 関連キーワード (filter: ms_copilot_keywords が参照)
# このいずれかが title / 本文に含まれていれば Microsoft Copilot エコシステム関連とみなす。
ms_copilot_keywords:
  # Copilot 系製品名
  - "Copilot"
  - "Microsoft Copilot"
  - "Microsoft 365 Copilot"
  - "M365 Copilot"
  - "Copilot Studio"
  - "Copilot Pro"
  - "Copilot for Sales"
  - "Copilot for Service"
  - "Copilot for Finance"
  - "Copilot for Security"
  - "Copilot in Teams"
  - "Copilot in Word"
  - "Copilot in Excel"
  - "Copilot in PowerPoint"
  - "Copilot in Outlook"
  - "Copilot in Loop"
  - "Copilot in OneNote"
  - "GitHub Copilot"
  - "GitHub Copilot Workspace"
  - "GitHub Copilot Chat"
  # Microsoft AI プラットフォーム
  - "Azure AI Foundry"
  - "Azure OpenAI"
  - "Azure AI Studio"
  - "Microsoft Fabric"
  - "Power Platform"
  - "Power Apps"
  - "Power Automate"
  - "Power BI"
  # 関連発表/イベント名
  - "Microsoft Ignite"
  - "Microsoft Build"
  - "Wave"  # M365 Copilot Wave 1/2/3 の文脈
  # 日本語表記
  - "マイクロソフト Copilot"
  - "コパイロット"
  - "コパイロット スタジオ"
